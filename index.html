<!doctype html>
<html lang="en">
<head>

<style>
  :root { color-scheme: light dark; --fg: #1d1f24; --muted: #6b7280; --bg: #fbfaf7; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e6e1; --muted: #9a9ca3; --bg: #121316; --accent: #fb923c; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 18px/1.6 ui-serif, Georgia, "Times New Roman", serif; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 2.4rem; line-height: 1.1; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  nav { display: flex; gap: 1.25rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }
</style>
</head>
<body>
<main>

  <nav>
    <a href="/notes/">Notes</a>

  </nav>
