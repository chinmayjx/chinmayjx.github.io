<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10252d" />
    <script>
      // Theme before first paint: the visitor's choice from the toggle, else the system setting.
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch {}
        const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name=theme-color]').content = theme === 'light' ? '#dce3d4' : '#10252d';
      })();
    </script>
    <meta name="description" content="A quiet walk through the woods. Notes on mind, philosophy, AI and work, by Chinmay Jain." />
    <title>Chinmay Jain — A walk in the woods</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2310252d'/%3E%3Cpath d='M11 29Q9 10 29 9Q30 28 11 29ZM11 29L25 14' fill='%23b7c7b2' stroke='%2310252d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the scripts; the loading veil covers the swap. -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.dataset.loaded = ''" onerror="this.dataset.loaded = ''" />
    <style>
      /* Inline so it shows before any stylesheet or script arrives. */
      .veil { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #10252d; color: #b7c7b2; transition: opacity .7s ease, visibility 0s .7s; }
      .veil svg { width: 34px; height: 46px; }
      .veil path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: veil-draw 1.6s ease-in-out infinite alternate; }
      .forest-ready .veil { opacity: 0; visibility: hidden; }
      @keyframes veil-draw { to { stroke-dashoffset: 0; } }
      [data-theme='light'] .veil { background: #dce3d4; color: #4d6450; }
      @media (prefers-reduced-motion: reduce) { .veil path { animation: none; stroke-dashoffset: 0; } }
    </style>
    <noscript><style>.veil { display: none; }</style></noscript>
  </head>
  <body>
    <div class="veil" aria-hidden="true"><svg viewBox="0 0 32 44" fill="none"><path d="M13 41Q17 23 19 4M17 23Q3 24 6 12Q16 13 17 23ZM18 16Q30 16 28 5Q20 6 18 16ZM14 34Q3 34 4 25Q13 26 14 34Z" stroke="currentColor" stroke-width=".85"/></svg></div>
    <nav class="ui-pill" aria-label="Elsewhere">
      <a href="#" data-placeholder aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9h3v10.5h-3zM6 3.8a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zM10 9h2.9v1.5c.5-.9 1.7-1.8 3.4-1.8 3.2 0 3.8 2 3.8 4.7v6.1h-3v-5.4c0-1.3 0-2.9-1.8-2.9s-2.2 1.4-2.2 2.8v5.5h-3z"/></svg></a>
      <a href="#" data-placeholder aria-label="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 3.5h3l-6.6 7.5 7.8 9.5h-6.1l-4.8-6-5.4 6h-3l7-8L3 3.5h6.2l4.3 5.5zm-1 15.2h1.7L8 5.2H6.2z"/></svg></a>
      <a href="https://github.com/chinmayjx" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a9.4 9.4 0 0 0-3 18.3c.5.1.6-.2.6-.5v-1.7c-2.6.6-3.2-1.2-3.2-1.2-.4-1.1-1-1.4-1-1.4-.9-.6 0-.6 0-.6.9.1 1.4 1 1.4 1 .8 1.4 2.2 1 2.7.8.1-.6.3-1 .6-1.2-2.1-.2-4.3-1-4.3-4.6 0-1 .4-1.9 1-2.5-.1-.3-.4-1.2.1-2.5 0 0 .8-.3 2.6 1a9 9 0 0 1 4.7 0c1.8-1.3 2.6-1 2.6-1 .5 1.3.2 2.2.1 2.5.6.7 1 1.5 1 2.5 0 3.6-2.2 4.4-4.3 4.6.3.3.6.9.6 1.7v2.6c0 .3.2.6.6.5A9.4 9.4 0 0 0 12 2.8z"/></svg></a>
      <a href="#" data-placeholder aria-label="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6h17v12h-17zm1.8 1.5L12 12.6l6.7-5.1zM5 9.2V16.5h14V9.2l-7 5.3z"/></svg></a>
      <span class="pill-divider" aria-hidden="true"></span>
      <button class="theme-toggle" type="button" aria-label="Switch to day">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </nav>
    <main id="walk" aria-label="A walk through the forest">
      <div class="stage">
        <div id="landscape" aria-hidden="true"></div>
        <header class="intro">
          <svg class="sprig" viewBox="0 0 32 44" fill="none" aria-hidden="true"><path d="M13 41Q17 23 19 4M17 23Q3 24 6 12Q16 13 17 23ZM18 16Q30 16 28 5Q20 6 18 16ZM14 34Q3 34 4 25Q13 26 14 34Z" stroke="currentColor" stroke-width=".85"/></svg>
          <h1>Chinmay Jain</h1>
          <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.</p>
        </header>
        <nav class="signpost" aria-label="Where to go">
          <svg class="post" viewBox="0 0 16 100" preserveAspectRatio="none" aria-hidden="true"><path class="post-wood" d="M1.5 1.6 8 0l6.5 1.6L15 100H1z"/><path class="post-lit" d="M10.5.6 14.5 1.6 15 100h-4z"/><path class="post-shade" d="M1.5 1.6 4 1v99H1z"/></svg>
          <div class="signpost-plates">
            <ul class="plates into" aria-label="Notes">
            <li><a class="plate" href="https://chinmayjain.me/notes/Mind/"><span>Mind</span></a></li>
            <li><a class="plate" href="https://chinmayjain.me/notes/Philosophy/"><span>Philosophy</span></a></li>
            <li><a class="plate" href="https://chinmayjain.me/notes/AI-and-Work/"><span>AI and Work</span></a></li>
            <li><a class="plate" href="https://chinmayjain.me/notes/"><span>All notes</span></a></li>
          </ul>
            <ul class="plates out" aria-label="Work">
            <li><a class="plate" href="#" data-placeholder><span>Work</span></a></li>
            <li><a class="plate" href="#" data-placeholder><span>Resume</span></a></li>
          </ul>
          </div>
        </nav>
        <div id="waypoints" class="world-layer" data-speed="1">
          <nav id="clearing" class="clearing" data-world-x="4140" aria-label="In the clearing">
            <svg class="sprig" viewBox="0 0 32 44" fill="none" aria-hidden="true"><path d="M13 41Q17 23 19 4M17 23Q3 24 6 12Q16 13 17 23ZM18 16Q30 16 28 5Q20 6 18 16ZM14 34Q3 34 4 25Q13 26 14 34Z" stroke="currentColor" stroke-width=".85"/></svg>
            <p class="clearing-caption">a clearing</p>
            <button class="return-link" type="button"><span aria-hidden="true">←</span> back to the entrance</button>
          </nav>
        </div>
        <div class="grain" aria-hidden="true"></div>
        <p class="walk-hint"><span class="hint-line" aria-hidden="true"></span>scroll to walk<span aria-hidden="true">↓</span></p>
        <div class="journey" aria-hidden="true"><span class="journey-track"></span><span class="journey-progress"></span></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
